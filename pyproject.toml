[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtga-mlip"
version = "0.1.0"
description = "Risk-triggered guarded adaptation for MLIP-driven molecular dynamics"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "RTGA authors"}
]
dependencies = [
  "numpy>=1.23"
]

[project.optional-dependencies]
dev = [
  "pytest>=7"
]

[project.scripts]
rtga-summarize = "rtga.io:summarize_cli"

[tool.setuptools.packages.find]
where = ["src"]

